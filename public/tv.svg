<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1226"/><stop offset="1" stop-color="#1f0d24"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="150" fill="#7c3aed" opacity=".22"/>
  <!-- TV -->
  <g transform="translate(400 20)">
    <line x1="190" y1="30" x2="150" y2="-10" stroke="#52525b" stroke-width="5" stroke-linecap="round"/>
    <line x1="190" y1="30" x2="240" y2="-10" stroke="#52525b" stroke-width="5" stroke-linecap="round"/>
    <rect x="30" y="30" width="320" height="220" rx="22" fill="#18181b" stroke="#52525b" stroke-width="5"/>
    <rect x="48" y="48" width="240" height="184" rx="12" fill="url(#screen)"/>
    <polygon points="140,100 140,180 205,140" fill="#fff" opacity=".95"/>
    <circle cx="320" cy="90" r="12" fill="#3f3f46"/><circle cx="320" cy="130" r="12" fill="#3f3f46"/>
    <rect x="308" y="180" width="24" height="36" rx="5" fill="#3f3f46"/>
    <rect x="90" y="250" width="30" height="22" fill="#3f3f46"/><rect x="260" y="250" width="30" height="22" fill="#3f3f46"/>
  </g>
  <!-- episode dots -->
  <g fill="#fff"><rect x="60" y="300" width="60" height="8" rx="4" opacity=".9"/><rect x="130" y="300" width="60" height="8" rx="4" opacity=".5"/><rect x="200" y="300" width="60" height="8" rx="4" opacity=".3"/></g>
</svg>
