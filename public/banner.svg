<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="75%" cy="45%" r="55%">
      <stop offset="0" stop-color="#e11d48" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#1a1024"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- projector beam -->
  <polygon points="1500,300 1920,0 1920,1080" fill="url(#beam)"/>
  <!-- film strip -->
  <g transform="rotate(-12 1400 540)" fill="#000" opacity=".85">
    <rect x="900" y="470" width="1300" height="170"/>
    <g fill="#2a2a38">
      <rect x="930" y="490" width="170" height="130" rx="6"/><rect x="1130" y="490" width="170" height="130" rx="6"/>
      <rect x="1330" y="490" width="170" height="130" rx="6"/><rect x="1530" y="490" width="170" height="130" rx="6"/>
      <rect x="1730" y="490" width="170" height="130" rx="6"/><rect x="1930" y="490" width="170" height="130" rx="6"/>
    </g>
    <g fill="#e11d48" opacity=".7"><rect x="1330" y="490" width="170" height="130" rx="6"/></g>
  </g>
  <!-- reel -->
  <g transform="translate(1450 330)">
    <circle r="190" fill="#15151f" stroke="#e11d48" stroke-width="10"/>
    <circle r="40" fill="#e11d48"/>
    <g fill="#0b0b12">
      <circle cx="0" cy="-110" r="32"/><circle cx="95" cy="-55" r="32"/><circle cx="95" cy="55" r="32"/>
      <circle cx="0" cy="110" r="32"/><circle cx="-95" cy="55" r="32"/><circle cx="-95" cy="-55" r="32"/>
    </g>
  </g>
  <!-- play triangle -->
  <polygon points="1360,760 1360,920 1500,840" fill="#e11d48" opacity=".9"/>
  <!-- stars -->
  <g fill="#fff" opacity=".5">
    <circle cx="300" cy="200" r="2"/><circle cx="620" cy="120" r="3"/><circle cx="980" cy="260" r="2"/>
    <circle cx="1700" cy="160" r="2"/><circle cx="1800" cy="880" r="3"/><circle cx="500" cy="900" r="2"/>
  </g>
</svg>
